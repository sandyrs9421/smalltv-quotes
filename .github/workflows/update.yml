name: update quotes
on:
  schedule:
    - cron: "7 * * * *"          # every hour at :07
  push:
    branches: [main]
    paths: ["coins.json", "scripts/**", ".github/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-quotes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch quotes from CoinGecko
        run: python3 scripts/fetch-quotes.py
      - name: Commit updated quotes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quotes
          git diff --cached --quiet || git commit -m "update quotes [skip ci]"
          git push
